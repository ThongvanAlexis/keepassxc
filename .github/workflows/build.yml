          echo ""
          echo "=== Homebrew ==="
          brew --version
          echo "libpng: $(brew list --versions libpng 2>/dev/null || echo 'not installed')"

      - name: Set artifact suffix
        run: echo "ARTIFACT_SUFFIX=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: brew install ninja autoconf autoconf-archive automake libtool

      - name: Set up ccache
        id: ccache-macos-arm64
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-arm64
          append-timestamp: false

      - name: Compiler cache status
        run: |
          echo "Exact hit: ${{ steps.ccache-macos-arm64.outputs.cache-hit }}"
          echo "Restored: ${{ steps.ccache-macos-arm64.outputs.cache-matched-key }}"

      - name: Install asciidoctor
        run: gem install asciidoctor

      - name: Create vcpkg binary cache directory
        run: mkdir -p "${{ github.workspace }}/vcpkg-binary-cache"

      - name: Restore vcpkg binary cache
        id: vcpkg-cache-macos-arm64
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: vcpkg-binary-arm64-osx-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-binary-arm64-osx-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-
            vcpkg-binary-arm64-osx-

      - name: Cache status
        run: |
          echo "Key: vcpkg-binary-arm64-osx-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}"
          echo "Exact hit: ${{ steps.vcpkg-cache-macos-arm64.outputs.cache-hit }}"
          echo "Restored: ${{ steps.vcpkg-cache-macos-arm64.outputs.cache-matched-key }}"

      - name: Configure CMake
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=arm64-osx-dynamic-release
          -DWITH_XC_ALL=ON
          -DWITH_TESTS=ON
          -DWITH_CCACHE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        id: tests-macos-arm64
        working-directory: build
        env:
          CTEST_OUTPUT_ON_FAILURE: '1'
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BRANCH="${GITHUB_REF_NAME//\//-}"
          SHORT_SHA="${GITHUB_SHA::7}"
          LOGFILE="test-log-macos-arm64-${BRANCH}-${SHORT_SHA}-${TIMESTAMP}.txt"
          echo "logfile=$LOGFILE" >> "$GITHUB_OUTPUT"
          ctest --extra-verbose --output-on-failure --test-output-size-failed 0 2>&1 | tee "$LOGFILE"
          exit ${PIPESTATUS[0]}

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.tests-macos-arm64.outputs.logfile }}
          path: build/${{ steps.tests-macos-arm64.outputs.logfile }}

      - name: Upload CTest internal log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-lasttest-macos-arm64
          path: build/Testing/Temporary/LastTest.log

      - name: Install
        run: cmake --install build --prefix build/install

      - name: Package DMG
        working-directory: build
        run: cpack -G DragNDrop

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: KeePassXC-macOS-ARM64-DMG-${{ env.ARTIFACT_SUFFIX }}
          path: build/*.dmg
          retention-days: 7

      - name: Save vcpkg binary cache
        if: "!cancelled() && steps.vcpkg-cache-macos-arm64.outputs.cache-hit != 'true'"
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: vcpkg-binary-arm64-osx-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

  macos-x64:
    runs-on: macos-15-intel
    timeout-minutes: 180
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache

    steps:
      - name: Runner diagnostics
