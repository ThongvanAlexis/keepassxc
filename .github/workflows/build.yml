      - name: Cache status
        run: |
          echo "Key: vcpkg-binary-x64-osx-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}"
          echo "Exact hit: ${{ steps.vcpkg-cache-macos-x64.outputs.cache-hit }}"
